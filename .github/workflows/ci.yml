name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Build-time env. These are dummy values that satisfy src/env.ts zod validation
# during `next build`. Production secrets live in Vercel, not here.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prelaunch:check
      - run: pnpm build

  # RLS tests deferred: Tasks 9-10 of the foundation plan never landed
  # (no tests/rls/ directory). Add an `rls-tests` job that runs against a
  # dedicated Supabase CI project once those tests exist.
