name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal gate: unit tests + strict typecheck.
# No lint step on purpose — the repo has 58 pre-existing eslint errors;
# add `pnpm lint` here only after that debt is cleared.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm via corepack — version pinned by the "packageManager" field
      # in package.json. Must run before setup-node so the pnpm cache works.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm vitest run --project unit

      - run: npx tsc --noEmit
